<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibs Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main-content">
      <div id="terminal">
        <div id="header">
          <p>Welcome to my terminal (v0.1.0)</p>
          <p>Type `help` for a list of commands.</p>
        </div>
        <div id="input-line">
          <div>
            <span>guest@terminal.bibs.com:~$ </span>
            <input type="text" id="command-input" autofocus />
          </div>
        </div>
        <div id="output"></div>
      </div>
      <script src="script.js" defer></script>
    </section>
  </body>
</html>
